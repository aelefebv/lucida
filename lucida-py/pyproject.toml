[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "lucida"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "websockets",
    "numpy",
    "lz4",
    "zstandard",
    "maturin>=1.12.6",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "scipy>=1.13.1",
]
