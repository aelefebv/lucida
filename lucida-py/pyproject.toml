[build-system]
# 1.9.4 is the first to set PYO3_BUILD_EXTENSION_MODULE, which lucida-py relies
# on in place of pyo3's `extension-module` feature.
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "lucida"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "websockets",
    "numpy",
    "lz4",
    "zstandard",
]

[tool.maturin]
module-name = "lucida.lucida"
python-source = "python"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "maturin>=1.12.6,<2.0",
    "pytest>=8.4.2",
    "scipy>=1.13.1",
]
