[package]
name = "lucida-py"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "lucida"
crate-type = ["cdylib"]

[dependencies]
lucida-core = { version = "0.2.0", path = "../lucida-core" }
lucida-content = { version = "0.2.0", path = "../lucida-content" }
lucida-protocol = { version = "0.2.0", path = "../lucida-protocol" }
lucida-store = { version = "0.2.0", path = "../lucida-store" }
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
object_store = "0.14.1"
bytes = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
