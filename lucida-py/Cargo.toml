[package]
name = "lucida-py"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# Not `lucida`: on Windows its debug info would overwrite that of the CLI's
# `lucida` binary. Python still imports `lucida.lucida`, through maturin's
# `module-name`.
name = "lucida_py"
crate-type = ["cdylib"]
# The tests are Python, run against the extension maturin builds. A Rust test
# binary would need libpython to link against, which an extension build never
# does.
test = false

[dependencies]
lucida-core = { path = "../lucida-core" }
lucida-content = { path = "../lucida-content" }
lucida-protocol = { path = "../lucida-protocol" }
lucida-store = { path = "../lucida-store" }
# No `extension-module` feature: pyo3 deprecates it, and maturin sets
# PYO3_BUILD_EXTENSION_MODULE for its own builds instead.
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
object_store = "0.14"
bytes = "1"
