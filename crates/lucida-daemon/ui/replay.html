<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucida Agent Replay</title>
    <link rel="stylesheet" href="/ui/replay.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <h1>Agent Visual Replay</h1>
          <p>Step through events and see what the agent saw.</p>
        </div>
        <a class="link-btn" href="/ui">Open Timeline UI</a>
      </header>

      <section class="panel controls">
        <label>
          Run
          <select id="run-select"></select>
        </label>
        <label>
          Event Limit
          <input id="event-limit" type="number" min="10" max="500" value="200" />
        </label>
        <label>
          Render Width
          <input id="render-width" type="number" min="64" max="2048" value="768" />
        </label>
        <label>
          Render Height
          <input id="render-height" type="number" min="64" max="2048" value="768" />
        </label>
        <div class="controls-actions">
          <button id="load-run">Load Run</button>
          <button id="refresh-runs" class="secondary">Refresh Runs</button>
          <span id="status" class="status">idle</span>
        </div>
      </section>

      <section class="panel playback">
        <div class="playback-controls">
          <button id="prev-frame" class="secondary">Prev</button>
          <button id="play-toggle">Play</button>
          <button id="next-frame" class="secondary">Next</button>
          <label>
            Speed
            <select id="playback-speed">
              <option value="1200">0.8x</option>
              <option value="900" selected>1x</option>
              <option value="500">2x</option>
              <option value="250">4x</option>
            </select>
          </label>
          <input id="frame-slider" type="range" min="0" max="0" value="0" />
          <span id="frame-indicator">frame 0/0</span>
        </div>

        <div class="playback-grid">
          <article class="viewport-panel">
            <h2>Agent Viewport</h2>
            <div id="viewport" class="viewport">
              <p>Select a run and frame.</p>
            </div>
          </article>

          <article class="changes-panel">
            <h2>State Changes</h2>
            <div id="changes" class="changes"></div>
          </article>
        </div>
      </section>

      <section class="panel">
        <h2>Action Timeline</h2>
        <div id="event-list" class="event-list"></div>
      </section>
    </main>
    <script src="/ui/replay.js"></script>
  </body>
</html>
