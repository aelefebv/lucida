<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucida Live View</title>
    <link rel="stylesheet" href="/ui/live.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <h1>Live View Mirror</h1>
          <p>Read-only browser mirror for one explicit view id.</p>
        </div>
        <div class="links">
          <a class="link-btn" href="/ui">Usage Timeline</a>
          <a class="link-btn" href="/ui/replay">Visual Replay</a>
        </div>
      </header>

      <section class="panel controls">
        <label>
          Session ID (optional)
          <select id="session-id">
            <option value="">Any session</option>
          </select>
        </label>
        <label>
          View ID
          <select id="view-id">
            <option value="">Select a view</option>
          </select>
        </label>
        <label>
          Render Width
          <input id="render-width" type="number" min="64" max="2048" value="1024" />
        </label>
        <label>
          Render Height
          <input id="render-height" type="number" min="64" max="2048" value="1024" />
        </label>
        <label>
          Render Mode
          <select id="render-mode">
            <option value="png">PNG Image</option>
            <option value="raw_rgba">Raw RGBA Canvas</option>
          </select>
        </label>
        <div class="actions">
          <button id="refresh-targets" class="secondary">Refresh Targets</button>
          <button id="connect">Connect</button>
          <button id="disconnect" class="secondary">Disconnect</button>
          <button id="render-now" class="secondary">Render Now</button>
        </div>
      </section>

      <section class="panel status-row">
        <div class="status-item">
          <span class="status-label">Stream</span>
          <span id="stream-status" class="status-value">disconnected</span>
        </div>
        <div class="status-item">
          <span class="status-label">Endpoint</span>
          <span id="last-endpoint" class="status-value">-</span>
        </div>
        <div class="status-item">
          <span class="status-label">State Hash</span>
          <code id="state-hash" class="status-code">-</code>
        </div>
        <div class="status-item">
          <span class="status-label">State Version</span>
          <span id="state-version" class="status-value">-</span>
        </div>
        <div class="status-item">
          <span class="status-label">Updated</span>
          <span id="updated-at" class="status-value">-</span>
        </div>
      </section>

      <section class="panel viewport-panel">
        <h2>Live Viewport</h2>
        <p id="viewport-note" class="note">Connect to start streaming events.</p>
        <div id="viewport" class="viewport">
          <p>No frame rendered yet.</p>
        </div>
      </section>

      <section class="panel thumbs-panel">
        <h2>Recent Render Thumbnails</h2>
        <div id="thumbs" class="thumbs">
          <p>No thumbnails captured yet.</p>
        </div>
      </section>
    </main>
    <script src="/ui/live.js"></script>
  </body>
</html>
