[package]
name = "lucida-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lucida engine skeleton for S0 contract-driven implementation"

[lib]
name = "lucida_engine"
path = "src/lib.rs"

[[bin]]
name = "lucida-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
lz4_flex = "0.11.5"
zstd = "0.13.3"
axum = { version = "0.8.6", features = ["ws"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "net", "time", "signal"] }
futures = "0.3.31"
thiserror = "2.0.17"

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "rustls-tls", "json"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
