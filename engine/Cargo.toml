[package]
name = "lucida-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lucida engine skeleton for S0 contract-driven implementation"

[lib]
name = "lucida_engine"
path = "src/lib.rs"

[[bin]]
name = "lucida-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
lz4_flex = "0.11.5"
zstd = "0.13.3"
