# Kubernetes ServiceAccount for the lucida pod.
#
# Bare upstream — lucida itself does not call the Kubernetes API and
# does not need any RBAC. The reason we ship a dedicated SA at all
# (rather than `default`) is that adopters routinely need to bind
# **cloud-provider workload identity** to the pod, and that binding
# attaches to a SA. Pinning a named SA upstream gives every adopter a
# stable identity to bind to without editing the Deployment.
#
# Provider-specific identity binding: the upstream manifest stays
# generic; ADR-0021 explicitly keeps cloud-specific resources out of
# this repo. Pick the snippet that matches your cluster and apply it
# in your own infra repo, NOT upstream.
#
# ----------------------------------------------------------------------
# GKE Workload Identity
# ----------------------------------------------------------------------
#   1. Create a Google Service Account (GSA) in your GCP project with
#      the IAM roles your deployment needs (e.g. roles/storage.objectViewer
#      for GCS dataset reads, roles/secretmanager.secretAccessor for
#      pulling LUCIDA_GOOGLE_CLIENT_SECRET via the Secrets Store CSI
#      driver, etc.).
#   2. Grant the KSA `iam.workloadIdentityUser` on the GSA:
#        gcloud iam service-accounts add-iam-policy-binding <GSA-EMAIL> \
#          --role roles/iam.workloadIdentityUser \
#          --member "serviceAccount:<PROJECT-ID>.svc.id.goog[<NAMESPACE>/lucida]"
#   3. Annotate this SA:
#        annotations:
#          iam.gke.io/gcp-service-account: <GSA-EMAIL>
#
# ----------------------------------------------------------------------
# EKS IRSA (IAM Roles for Service Accounts)
# ----------------------------------------------------------------------
#   1. Create an IAM role with a trust policy that allows the EKS OIDC
#      provider to assume it for sub `system:serviceaccount:<NAMESPACE>:lucida`.
#   2. Attach the IAM policies your deployment needs (S3, KMS, Secrets
#      Manager, ...) to the role.
#   3. Annotate this SA:
#        annotations:
#          eks.amazonaws.com/role-arn: arn:aws:iam::<AWS-ACCOUNT-ID>:role/<ROLE-NAME>
#
# ----------------------------------------------------------------------
# AKS Workload Identity (Azure AD)
# ----------------------------------------------------------------------
#   1. Create an Azure AD app + federated credential whose subject is
#      `system:serviceaccount:<NAMESPACE>:lucida`.
#   2. Grant the app the Azure RBAC roles your deployment needs.
#   3. Annotate AND label this SA:
#        annotations:
#          azure.workload.identity/client-id: <AZURE-AD-CLIENT-ID>
#        labels:
#          azure.workload.identity/use: "true"
#      Pods using this SA also need the label
#      `azure.workload.identity/use: "true"` on the pod template.
#
# ----------------------------------------------------------------------
# On-prem / non-cloud (k3s, Talos, OpenShift, vanilla kubeadm)
# ----------------------------------------------------------------------
# No identity binding required. The bare SA is sufficient. Fetch
# secrets from your in-cluster secret manager (Vault, Sealed Secrets,
# SOPS-decrypted by the GitOps controller, etc.) and reference them
# from the Deployment's env block. lucida itself never calls the
# Kubernetes API, so no RBAC binding is needed either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lucida
  namespace: <YOUR-NAMESPACE>
  labels:
    app.kubernetes.io/name: lucida
    app.kubernetes.io/component: server
  # Add the cloud-specific annotation from the matching block above
  # in your fork. Left empty upstream so this manifest applies cleanly
  # on every cluster (including on-prem) without requiring a CRD or a
  # cloud-specific controller.
  # annotations: {}
