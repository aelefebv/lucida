# Persistent volume for SQLite + generated-coarse data + any retired proxy
# artifacts pending explicit upgrade cleanup.
#
# Why ReadWriteOnce: the lucida Deployment is intentionally a single
# replica (see deployment.yaml header). SQLite + WAL is single-writer,
# and the generated cache is also single-writer. ReadWriteOnce is the
# correct access mode and the most widely supported across CSI drivers.
#
# Why 50Gi: a starting point. The reference deployment caps recomputable
# generated-coarse chunks at 8 GiB, leaving 42 GiB of nominal headroom for
# authoritative SQLite/WAL state and optional operator datasets. Adopters with
# large local datasets should resize upward or lower the cache cap; the SQLite
# database itself normally stays small (sessions + workspace/saved-view rows).
# Resizing the PVC after the fact requires a CSI driver that supports
# `allowVolumeExpansion: true` on the StorageClass.
#
# StorageClass placeholder: every cluster has its own. Examples:
#   - GKE:        standard-rwo, premium-rwo, balanced-rwo
#   - EKS:        gp3, gp2, io2
#   - AKS:        managed-csi, managed-premium
#   - on-prem:    longhorn, openebs-hostpath, rook-ceph-block, local-path
# Leaving `storageClassName` unset uses the cluster default; we set it
# explicitly so the manifest is self-documenting and survives default-
# class changes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lucida-data
  namespace: <YOUR-NAMESPACE>
  labels:
    app.kubernetes.io/name: lucida
    app.kubernetes.io/component: server
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: <YOUR-STORAGE-CLASS>
  resources:
    requests:
      storage: 50Gi
