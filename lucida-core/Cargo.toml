[package]
name = "lucida-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The view property checks and their fixtures, for the tests of crates whose
# view producers live outside this one.
test-support = []
# Decode zstd with libzstd rather than ruzstd. Native builds only: libzstd is
# C, and the WASM module must stay pure Rust.
native-zstd = ["dep:zstd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Exact float parsing: a saved view decoded and encoded again must keep every
# camera coordinate, and the default parser can land one ULP off. The viewer
# parses its payloads in the WASM module, so it stays on there despite its size.
serde_json = { version = "1", features = ["float_roundtrip"] }
lucida-content = { path = "../lucida-content" }
lucida-protocol = { path = "../lucida-protocol" }
indexmap = { version = "2", features = ["serde"] }
base64 = "0.23"
miniz_oxide = "0.9"
# The storage codecs, decoded here for both the server and the page.
ruzstd = "0.9"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "checked-decode"] }
crc32c = "0.6"
thiserror = "2"
zstd = { version = "0.14", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
flate2 = "1"
lz4_flex = "0.14"
zstd = "0.14"

[package.metadata.wasm-pack.profile.release]
# wasm-pack's bundled wasm-opt can lag current Rust WASM output; CI and
# Docker should build the package without invoking that optimizer.
wasm-opt = false
