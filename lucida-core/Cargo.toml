[package]
name = "lucida-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lucida-content = { path = "../lucida-content" }
lucida-protocol = { path = "../lucida-protocol" }
indexmap = { version = "2", features = ["serde"] }
# Used by `saved_view::dataset_id_for_url` to mirror lucida-server's URL
# hashing exactly. See `wiki/decisions/0014-local-file-datasets-personal-only-in-saved-views.md`.
blake3 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
