[package]
name = "lucida-core"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lucida-content = { path = "../lucida-content" }
lucida-protocol = { path = "../lucida-protocol" }
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# wasm-pack's bundled wasm-opt can lag current Rust WASM output; CI and
# Docker should build the package without invoking that optimizer.
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
