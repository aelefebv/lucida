<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable" data-accent="indigo" data-canvas="black">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lucida-web</title>
    <!-- deployment theme -->
    <script>
      // Apply the stored appearance before first paint, so a reload never
      // flashes the wrong theme. Mirrors applyAppearance in
      // src/theme/appearance.ts and applyDeploymentTheme in
      // src/theme/deployment.ts, and a test runs both to keep them equal.
      (function () {
        var root = document.documentElement;
        var values = {};
        var deployment = {};
        try {
          // The capture surface ignores stored preferences (preferences.ts).
          if (new URLSearchParams(location.search).get("render") !== "1") {
            values = JSON.parse(localStorage.getItem("lucida.preferences") || "{}").values || {};
          }
        } catch (e) {}
        try {
          // The server writes the deployment's theme in place of the
          // comment above; its defaults sit under the stored values.
          deployment = JSON.parse(document.getElementById("lucida-deployment-theme").textContent) || {};
        } catch (e) {}
        var defaults = deployment.defaults || {};
        function pick(value, allowed, fallback) {
          return allowed.indexOf(value) >= 0 ? value : fallback;
        }
        function choose(key, allowed, builtIn) {
          return pick(values["appearance." + key], allowed, pick(defaults[key], allowed, builtIn));
        }
        var theme = choose("theme", ["dark", "light", "system"], "dark");
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-density", choose("density", ["comfortable", "compact"], "comfortable"));
        root.setAttribute(
          "data-canvas",
          choose("canvasBackground", ["black", "dark-gray", "white", "theme"], "black"),
        );
        function accentOr(value, fallback) {
          if (typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value)) return value;
          return pick(value, ["indigo", "blue", "teal", "green", "amber", "rose"], fallback);
        }
        var accent = accentOr(values["appearance.accent"], accentOr(defaults.accent, "indigo"));
        if (accent.charAt(0) === "#") {
          root.setAttribute("data-accent", "custom");
          root.style.setProperty("--lc-accent", accent);
        } else {
          root.setAttribute("data-accent", accent);
        }
        var tokens = deployment.tokens || {};
        var css = "";
        ["dark", "light"].forEach(function (preset) {
          var body = "";
          for (var name in tokens[preset]) {
            var value = tokens[preset][name];
            if (/^--lc-[\w-]+$/.test(name) && typeof value === "string" && !/[;{}<]/.test(value)) {
              body += "  " + name + ": " + value + ";\n";
            }
          }
          if (body) css += 'html:root[data-theme="' + preset + '"] {\n' + body + "}\n";
        });
        if (css) {
          var style = document.createElement("style");
          style.id = "lucida-deployment-tokens";
          style.textContent = css;
          document.head.appendChild(style);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
