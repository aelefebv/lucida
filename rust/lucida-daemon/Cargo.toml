[package]
name = "lucida-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.4", features = ["http1", "json"] }
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = "0.5.2"
