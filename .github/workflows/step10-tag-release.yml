name: Step 10 Tag Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag_meta.outputs.tag }}
      semver: ${{ steps.tag_meta.outputs.semver }}
      python_version: ${{ steps.tag_meta.outputs.python_version }}
      is_prerelease: ${{ steps.tag_meta.outputs.is_prerelease }}
      channel: ${{ steps.tag_meta.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse release tag
        id: tag_meta
        run: python3 scripts/release/parse_tag_version.py --tag "${GITHUB_REF_NAME}" --github-output "${GITHUB_OUTPUT}" --format json

      - name: Ensure tag commit is reachable from main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tags must point to commits reachable from main."
            exit 1
          fi

      - name: Verify version metadata synchronization
        run: python3 scripts/release/verify_version_sync.py --tag "${GITHUB_REF_NAME}"

  strict-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: preflight
    env:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: miniopass
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
      LUCIDA_TEST_S3_URI: s3://lucida-step3/fixtures/sample.zarr
      LUCIDA_TEST_GCS_URI: gs://lucida-step3/fixtures/sample.zarr
      LUCIDA_STEP4_PERF_SMOKE_P95_MS: "50"
      LUCIDA_STEP5_PERF_SMOKE_P95_MS: "60"
      LUCIDA_STEP6_PERF_SMOKE_P95_MS: "80"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Sync dependencies
        run: uv sync --all-extras --python 3.12

      - name: Run context checks
        run: python3 scripts/check_context.py

      - name: Run context contract tests
        run: python3 -m unittest tests/context/test_context_contracts.py -v

      - name: Run protocol and generated model tests
        run: |
          PYTHONPATH=tests/protocol uv run --python 3.12 python -m unittest \
            tests/protocol/test_generated_models.py \
            tests/protocol/test_openrpc_integrity.py \
            tests/protocol/test_schema_conformance.py \
            tests/protocol/test_protocol_policies.py \
            tests/protocol/test_command_log_roundtrip.py -v

      - name: Run Step 10 release tests
        run: |
          uv run --python 3.12 python -m unittest \
            tests/release/test_step10_version_mapping.py \
            tests/release/test_step10_version_sync.py \
            tests/release/test_step10_workflow_contracts.py -v

      - name: Start MinIO emulator
        run: |
          docker run -d --name lucida-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="${AWS_ACCESS_KEY_ID}" \
            -e MINIO_ROOT_PASSWORD="${AWS_SECRET_ACCESS_KEY}" \
            minio/minio:latest server /data

      - name: Start fake GCS emulator
        run: |
          docker run -d --name lucida-fake-gcs \
            -p 4443:4443 \
            fsouza/fake-gcs-server:latest \
            -scheme http \
            -port 4443 \
            -external-url http://127.0.0.1:4443

      - name: Wait for emulators
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:4443/storage/v1/b >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Provision S3 and GCS OME-Zarr fixtures
        run: |
          uv run --python 3.12 python - <<'PY'
          import os

          import gcsfs
          import s3fs
          import zarr

          bucket = "lucida-step3"

          def create_array_compat(group, path):
              create_array = getattr(group, "create_array", None)
              if callable(create_array):
                  try:
                      create_array(
                          name=path,
                          shape=(1, 1, 4, 16, 16),
                          chunks=(1, 1, 2, 8, 8),
                          dtype="uint16",
                          fill_value=0,
                      )
                  except TypeError:
                      create_array(
                          path,
                          shape=(1, 1, 4, 16, 16),
                          chunks=(1, 1, 2, 8, 8),
                          dtype="uint16",
                          fill_value=0,
                      )
              else:
                  group.create_dataset(
                      path,
                      shape=(1, 1, 4, 16, 16),
                      chunks=(1, 1, 2, 8, 8),
                      dtype="uint16",
                      fill_value=0,
                  )

          s3 = s3fs.S3FileSystem(
              key=os.environ["AWS_ACCESS_KEY_ID"],
              secret=os.environ["AWS_SECRET_ACCESS_KEY"],
              client_kwargs={"endpoint_url": os.environ["AWS_ENDPOINT_URL"]},
              use_ssl=False,
              anon=False,
          )
          if not s3.exists(bucket):
              s3.mkdir(bucket)
          s3_mapper = s3.get_mapper(f"{bucket}/fixtures/sample.zarr", check=False)
          s3_group = zarr.open_group(store=s3_mapper, mode="w")
          create_array_compat(s3_group, "0")
          s3_group.attrs["multiscales"] = [{
              "name": "main",
              "version": "0.5",
              "axes": [
                  {"name": "t", "type": "time"},
                  {"name": "c", "type": "channel"},
                  {"name": "z", "type": "space"},
                  {"name": "y", "type": "space"},
                  {"name": "x", "type": "space"},
              ],
              "datasets": [{"path": "0"}],
          }]

          gcs = gcsfs.GCSFileSystem(token="anon")
          if not gcs.exists(bucket):
              gcs.mkdir(bucket)
          gcs_mapper = gcs.get_mapper(f"{bucket}/fixtures/sample.zarr")
          gcs_group = zarr.open_group(store=gcs_mapper, mode="w")
          create_array_compat(gcs_group, "0")
          gcs_group.attrs["multiscales"] = [{
              "name": "main",
              "version": "0.5",
              "axes": [
                  {"name": "t", "type": "time"},
                  {"name": "c", "type": "channel"},
                  {"name": "z", "type": "space"},
                  {"name": "y", "type": "space"},
                  {"name": "x", "type": "space"},
              ],
              "datasets": [{"path": "0"}],
          }]
          PY

      - name: Run strict runtime suites
        run: |
          uv run --python 3.12 python -m unittest \
            tests/core/test_step3_backend_integrations.py \
            tests/core/test_step4_render2d.py \
            tests/core/test_step5_render3d.py \
            tests/core/test_step6_points_graph.py \
            tests/core/test_step9_command_log.py \
            tests/daemon/test_step7_daemon_runtime.py \
            tests/sdk/test_step8_sdk_client.py -v

      - name: Run perf smoke suites
        run: |
          uv run --python 3.12 python -m unittest \
            tests/perf/test_step4_render2d_perf.py \
            tests/perf/test_step5_render3d_perf.py \
            tests/perf/test_step6_points_perf.py -v

      - name: Show emulator logs on failure
        if: failure()
        run: |
          docker logs lucida-minio || true
          docker logs lucida-fake-gcs || true

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [preflight, strict-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build signed DMG
        id: build
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          APPLE_SIGNING_CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          ARTIFACT_PATH="$(bash scripts/release/build_macos_dmg.sh)"
          echo "artifact_path=${ARTIFACT_PATH}" >>"${GITHUB_OUTPUT}"

      - name: Generate macOS SBOM
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          artifact = Path("${{ steps.build.outputs.artifact_path }}")
          sbom_path = artifact.with_suffix(artifact.suffix + ".sbom.spdx.json")
          sbom = {
              "spdxVersion": "SPDX-2.3",
              "SPDXID": "SPDXRef-DOCUMENT",
              "name": artifact.name,
              "dataLicense": "CC0-1.0",
              "documentNamespace": f"https://lucida.dev/spdx/{artifact.name}",
              "creationInfo": {
                  "created": "2026-02-20T00:00:00Z",
                  "creators": ["Tool: lucida-step10-release"],
              },
              "files": [
                  {
                      "fileName": artifact.name,
                      "checksums": [
                          {
                              "algorithm": "SHA256",
                              "checksumValue": hashlib.sha256(artifact.read_bytes()).hexdigest(),
                          }
                      ],
                  }
              ],
          }
          sbom_path.write_text(json.dumps(sbom, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: step10-macos-release
          path: |
            ${{ steps.build.outputs.artifact_path }}
            ${{ steps.build.outputs.artifact_path }}.sbom.spdx.json

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [preflight, strict-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX CLI
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Add dotnet tool path
        shell: pwsh
        run: |
          "$env:USERPROFILE\\.dotnet\\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build signed MSI
        id: build
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $artifact = ./scripts/release/build_windows_msi.ps1 -ReleaseTag $env:RELEASE_TAG
          "artifact_path=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate Windows SBOM
        shell: pwsh
        run: |
          $script = @'
          import hashlib
          import json
          from pathlib import Path

          artifact = Path(r"${{ steps.build.outputs.artifact_path }}")
          sbom_path = Path(str(artifact) + ".sbom.spdx.json")
          sbom = {
              "spdxVersion": "SPDX-2.3",
              "SPDXID": "SPDXRef-DOCUMENT",
              "name": artifact.name,
              "dataLicense": "CC0-1.0",
              "documentNamespace": f"https://lucida.dev/spdx/{artifact.name}",
              "creationInfo": {
                  "created": "2026-02-20T00:00:00Z",
                  "creators": ["Tool: lucida-step10-release"],
              },
              "files": [
                  {
                      "fileName": artifact.name,
                      "checksums": [
                          {
                              "algorithm": "SHA256",
                              "checksumValue": hashlib.sha256(artifact.read_bytes()).hexdigest(),
                          }
                      ],
                  }
              ],
          }
          sbom_path.write_text(json.dumps(sbom, sort_keys=True, indent=2) + "\\n", encoding="utf-8")
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP "step10_windows_sbom.py"
          $script | Out-File -FilePath $scriptPath -Encoding utf8
          python $scriptPath

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: step10-windows-release
          path: |
            ${{ steps.build.outputs.artifact_path }}
            ${{ steps.build.outputs.artifact_path }}.sbom.spdx.json

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [preflight, strict-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2
          curl -L -o /tmp/appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          sudo mv /tmp/appimagetool.AppImage /usr/local/bin/appimagetool

      - name: Build signed AppImage
        id: build
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          APPIMAGE_GPG_PRIVATE_KEY_ASC: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY_ASC }}
          APPIMAGE_GPG_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
        run: |
          ARTIFACT_PATH="$(bash scripts/release/build_linux_appimage.sh)"
          echo "artifact_path=${ARTIFACT_PATH}" >>"${GITHUB_OUTPUT}"

      - name: Generate Linux SBOM
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          artifact = Path("${{ steps.build.outputs.artifact_path }}")
          sbom_path = artifact.with_suffix(artifact.suffix + ".sbom.spdx.json")
          sbom = {
              "spdxVersion": "SPDX-2.3",
              "SPDXID": "SPDXRef-DOCUMENT",
              "name": artifact.name,
              "dataLicense": "CC0-1.0",
              "documentNamespace": f"https://lucida.dev/spdx/{artifact.name}",
              "creationInfo": {
                  "created": "2026-02-20T00:00:00Z",
                  "creators": ["Tool: lucida-step10-release"],
              },
              "files": [
                  {
                      "fileName": artifact.name,
                      "checksums": [
                          {
                              "algorithm": "SHA256",
                              "checksumValue": hashlib.sha256(artifact.read_bytes()).hexdigest(),
                          }
                      ],
                  }
              ],
          }
          sbom_path.write_text(json.dumps(sbom, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: step10-linux-release
          path: |
            ${{ steps.build.outputs.artifact_path }}
            ${{ steps.build.outputs.artifact_path }}.asc
            ${{ steps.build.outputs.artifact_path }}.sbom.spdx.json

  build-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, strict-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --python 3.12

      - name: Build Python distributions
        run: uv tool run --from build pyproject-build --sdist --wheel --outdir dist/python

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: step10-python-dist
          path: dist/python/*

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, build-macos, build-windows, build-linux, build-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: step10-macos-release
          path: dist/release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: step10-windows-release
          path: dist/release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: step10-linux-release
          path: dist/release

      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: step10-python-dist
          path: dist/python

      - name: Generate release checksums
        run: bash scripts/release/generate_checksums.sh

      - name: Verify integrity artifact presence
        run: |
          test -f dist/release/SHA256SUMS
          test -n "$(find dist/release -maxdepth 1 -type f -name '*.sbom.spdx.json' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -type f -name '*.msi' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -type f -name '*.AppImage.asc' -print -quit)"

      - name: Create provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/*
            dist/python/*

      - name: Publish Python distributions
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: bash scripts/release/publish_pypi.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: bash scripts/release/create_github_release.sh
