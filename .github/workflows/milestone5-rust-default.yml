name: milestone5-rust-default

on:
  pull_request:
  push:

jobs:
  milestone5-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Run Milestone 5 gate script
        run: |
          chmod +x scripts/ci_milestone5.sh
          ./scripts/ci_milestone5.sh
