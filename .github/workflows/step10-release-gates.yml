name: Step 10 Release Gates

on:
  pull_request:
  push:
    branches:
      - main
      - refactor
      - "codex/**"
  workflow_dispatch:

jobs:
  release-gates-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Sync dependencies
        run: uv sync --all-extras --python 3.12

      - name: Run context checks
        run: python3 scripts/check_context.py

      - name: Run context contract tests
        run: python3 -m unittest tests/context/test_context_contracts.py -v

      - name: Run protocol integrity and freshness tests
        run: |
          PYTHONPATH=tests/protocol uv run --python 3.12 python -m unittest \
            tests/protocol/test_generated_models.py \
            tests/protocol/test_openrpc_integrity.py \
            tests/protocol/test_schema_conformance.py \
            tests/protocol/test_protocol_policies.py -v

      - name: Run Step 10 release tests
        run: |
          uv run --python 3.12 python -m unittest \
            tests/release/test_step10_version_mapping.py \
            tests/release/test_step10_version_sync.py \
            tests/release/test_step10_workflow_contracts.py -v

      - name: Verify release version sync baseline
        run: |
          TAG="$(python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("rust/Cargo.toml").read_text(encoding="utf-8"))
          version = cargo["workspace"]["package"]["version"]
          match = re.fullmatch(r"(\\d+)\\.(\\d+)\\.(\\d+)(?:-rc\\.(\\d+))?", version)
          if match is None:
              raise SystemExit(f"unexpected rust workspace version: {version}")
          major, minor, patch, rc = match.groups()
          if rc is None:
              print(f"v{major}.{minor}.{patch}")
          else:
              print(f"v{major}.{minor}.{patch}-rc.{rc}")
          PY
          )"
          python3 scripts/release/verify_version_sync.py --tag "${TAG}"

      - name: Run Rust workspace check
        run: cargo check --manifest-path rust/Cargo.toml --workspace

      - name: Run Rust workspace tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Build Python wheel and sdist smoke
        run: uv tool run --from build pyproject-build --sdist --wheel --outdir dist/python

      - name: Run Linux AppImage packaging smoke
        env:
          RELEASE_TAG: v0.1.0
          DRY_RUN: "1"
          UNSIGNED: "1"
        run: bash scripts/release/build_linux_appimage.sh

  release-gates-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run macOS DMG packaging smoke
        env:
          RELEASE_TAG: v0.1.0
          DRY_RUN: "1"
          UNSIGNED: "1"
        run: bash scripts/release/build_macos_dmg.sh

  release-gates-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Windows MSI packaging smoke
        env:
          RELEASE_TAG: v0.1.0
          DRY_RUN: "1"
          UNSIGNED: "1"
        shell: pwsh
        run: ./scripts/release/build_windows_msi.ps1 -ReleaseTag $env:RELEASE_TAG -DryRun -Unsigned
