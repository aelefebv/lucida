name: Step 4 Render2D

on:
  pull_request:
  push:
    branches:
      - main
      - refactor
      - "codex/**"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  step4-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --python 3.12

      - name: Run Step 4 deterministic tests
        run: uv run --python 3.12 python -m unittest tests/core/test_step4_render2d.py -v

      - name: Run Step 4 perf smoke
        env:
          LUCIDA_STEP4_PERF_SMOKE_P95_MS: "50"
        run: uv run --python 3.12 python -m unittest tests/perf/test_step4_render2d_perf.py -v

  step4-nightly-perf:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --python 3.12

      - name: Run Step 4 deterministic tests
        run: uv run --python 3.12 python -m unittest tests/core/test_step4_render2d.py -v

      - name: Run Step 4 full perf regression gate
        env:
          LUCIDA_STEP4_PERF_FULL: "1"
          LUCIDA_STEP4_PERF_SMOKE_P95_MS: "50"
          LUCIDA_STEP4_PERF_REGRESSION_FACTOR: "1.25"
        run: uv run --python 3.12 python -m unittest tests/perf/test_step4_render2d_perf.py -v
