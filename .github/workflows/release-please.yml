name: Release please

on:
  push:
    branches: [main]

# release-please needs to write to the repo (push branch + tag) and open
# the release PR. No other scopes are required.
permissions:
  contents: write
  pull-requests: write

# Don't race: only one release-please run at a time per ref. The action
# is idempotent (re-runs reconcile the open PR), but parallel runs waste
# CI minutes and occasionally lose the rebase race for the release branch.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or update the Release vX.Y.Z PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Manifest mode: action reads ./release-please-config.json and
          # ./.release-please-manifest.json from the repo root for the
          # workspace + web package layout.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PAT with `repo` + `workflow` scopes (stored as repo secret
          # RELEASE_PLEASE_TOKEN). Required so the tag-push that release-
          # please performs when the release PR merges actually triggers
          # downstream workflows — specifically release.yml. The default
          # GITHUB_TOKEN can't trigger workflow-from-workflow chains, so
          # release.yml would never fire and no image would be built.
          # See wiki/gotchas/branching-and-releases for the full story.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Auto-merge is OFF per ADR-0022. The action opens or updates
          # the "chore(release): X.Y.Z" PR; the maintainer manually
          # merges it when a release is desired. This lets a solo / small-
          # team maintainer batch related changes (e.g. a fix: immediately
          # followed by a related feat:) into one release rather than
          # one-release-per-merge.
