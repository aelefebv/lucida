name: Secret scan

# Catches credential / token shapes that GitHub's native secret scanning
# might miss (custom formats, unusual entropy patterns) before they land
# on main. GitHub Push Protection (Settings -> Code security) is the
# first line of defense; this is the belt-and-braces second line.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Only one scan per ref at a time; supersede in-flight runs when a new
# commit lands.
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full history on push; needs unshallowed.
          # On PRs the action narrows to the PR diff automatically.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for organization commercial use
          # but not for public repos / personal accounts. Leaving unset.
