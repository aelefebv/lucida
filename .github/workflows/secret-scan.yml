name: Secret scan

# Catches credential / token shapes that GitHub's native secret scanning
# might miss (custom formats, unusual entropy patterns) before they land
# on main. GitHub Push Protection (Settings -> Code security) is the
# first line of defense; this is the belt-and-braces second line.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Only one scan per ref at a time; supersede in-flight runs when a new
# commit lands.
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The scanned range starts below the checked-out commit.
          fetch-depth: 0

      # Fetched as the CI workflow's cargo-deny is: the release asset through
      # the REST API first and the github.com download URL second, because
      # the download URL can return 504s for long stretches while the API
      # route still serves. gitleaks/gitleaks-action fetches only from the
      # download URL, so it is not used. The version is the one that action
      # ran, so the rules are unchanged.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gh release download "v$GITLEAKS_VERSION" -R gitleaks/gitleaks -p "$asset" --clobber \
            || curl -fsSL --retry 5 --retry-all-errors -o "$asset" \
                 "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$asset"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $asset" | sha256sum -c -
          tar -xzf "$asset" -C /usr/local/bin gitleaks

      # The commits this event adds, as the action scanned them: a pull
      # request's own commits, or what a push to main brought. First parent
      # only, so commits a branch merged in from main are not scanned again.
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "pull_request" ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # No usable before: the push created the ref, or rewrote it.
            range="-1 $PUSH_AFTER"
          fi
          gitleaks detect --redact --verbose --log-opts="--no-merges --first-parent $range"
