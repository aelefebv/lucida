name: Step 3 IO Integration

on:
  pull_request:
  push:
    branches:
      - main
      - refactor
      - "codex/**"

jobs:
  io-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        zarr_spec:
          - "zarr>=2.18.0,<3"
          - "zarr>=3,<4"
    env:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: miniopass
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
      LUCIDA_TEST_S3_URI: s3://lucida-step3/fixtures/sample.zarr
      LUCIDA_TEST_GCS_URI: gs://lucida-step3/fixtures/sample.zarr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (including backend extras)
        run: uv sync --all-extras --python 3.12

      - name: Pin zarr lane
        run: |
          uv pip install --python .venv/bin/python --upgrade "${{ matrix.zarr_spec }}"
          uv run --python 3.12 python - <<'PY'
          import zarr
          print(zarr.__version__)
          PY

      - name: Start MinIO emulator
        run: |
          docker run -d --name lucida-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="${AWS_ACCESS_KEY_ID}" \
            -e MINIO_ROOT_PASSWORD="${AWS_SECRET_ACCESS_KEY}" \
            minio/minio:latest server /data

      - name: Start fake GCS emulator
        run: |
          docker run -d --name lucida-fake-gcs \
            -p 4443:4443 \
            fsouza/fake-gcs-server:latest \
            -scheme http \
            -port 4443 \
            -external-url http://127.0.0.1:4443

      - name: Wait for emulators
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:4443/storage/v1/b >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Provision S3 and GCS OME-Zarr fixtures
        run: |
          uv run --python 3.12 python - <<'PY'
          import os

          import gcsfs
          import s3fs
          import zarr

          bucket = "lucida-step3"

          def create_array_compat(group, path):
              create_array = getattr(group, "create_array", None)
              if callable(create_array):
                  try:
                      create_array(
                          name=path,
                          shape=(1, 1, 4, 16, 16),
                          chunks=(1, 1, 2, 8, 8),
                          dtype="uint16",
                          fill_value=0,
                      )
                  except TypeError:
                      create_array(
                          path,
                          shape=(1, 1, 4, 16, 16),
                          chunks=(1, 1, 2, 8, 8),
                          dtype="uint16",
                          fill_value=0,
                      )
              else:
                  group.create_dataset(
                      path,
                      shape=(1, 1, 4, 16, 16),
                      chunks=(1, 1, 2, 8, 8),
                      dtype="uint16",
                      fill_value=0,
                  )

          # S3 fixture on MinIO.
          s3 = s3fs.S3FileSystem(
              key=os.environ["AWS_ACCESS_KEY_ID"],
              secret=os.environ["AWS_SECRET_ACCESS_KEY"],
              client_kwargs={"endpoint_url": os.environ["AWS_ENDPOINT_URL"]},
              use_ssl=False,
              anon=False,
          )
          if not s3.exists(bucket):
              s3.mkdir(bucket)
          s3_mapper = s3.get_mapper(f"{bucket}/fixtures/sample.zarr", check=False)
          s3_group = zarr.open_group(store=s3_mapper, mode="w")
          create_array_compat(s3_group, "0")
          s3_group.attrs["multiscales"] = [{
              "name": "main",
              "version": "0.5",
              "axes": [
                  {"name": "t", "type": "time"},
                  {"name": "c", "type": "channel"},
                  {"name": "z", "type": "space"},
                  {"name": "y", "type": "space"},
                  {"name": "x", "type": "space"},
              ],
              "datasets": [{"path": "0"}],
          }]

          # GCS fixture on fake-gcs-server.
          gcs = gcsfs.GCSFileSystem(token="anon")
          if not gcs.exists(bucket):
              gcs.mkdir(bucket)
          gcs_mapper = gcs.get_mapper(f"{bucket}/fixtures/sample.zarr")
          gcs_group = zarr.open_group(store=gcs_mapper, mode="w")
          create_array_compat(gcs_group, "0")
          gcs_group.attrs["multiscales"] = [{
              "name": "main",
              "version": "0.5",
              "axes": [
                  {"name": "t", "type": "time"},
                  {"name": "c", "type": "channel"},
                  {"name": "z", "type": "space"},
                  {"name": "y", "type": "space"},
                  {"name": "x", "type": "space"},
              ],
              "datasets": [{"path": "0"}],
          }]
          PY

      - name: Run Step 3 backend integration tests
        run: uv run --python 3.12 python -m unittest tests/core/test_step3_backend_integrations.py -v

      - name: Show emulator logs on failure
        if: failure()
        run: |
          docker logs lucida-minio || true
          docker logs lucida-fake-gcs || true
