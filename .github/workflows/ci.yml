name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Cancel an in-flight CI run when a new commit lands on the same ref
# (push to main supersedes earlier pushes; new PR commits supersede earlier ones).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace (test + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The PostgreSQL conformance cases skip themselves when no server is
    # reachable, which is what lets a developer without PostgreSQL run the
    # suite. CI is the place that must not skip, so it runs one. Pin the
    # major version to what a deployment runs; the schema targets 17.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lucida
          POSTGRES_PASSWORD: lucida
          POSTGRES_DB: lucida_test
        ports:
          - 5432:5432
        # Without this the job races the server's startup, and a connect
        # failure fails the run rather than waiting for it.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # --locked: fail if Cargo.lock is out of sync with the manifests
      # instead of silently re-resolving deps on the runner. Keeps CI
      # testing the same dep graph the Docker image builds from.
      - name: cargo test
        env:
          LUCIDA_TEST_POSTGRES_URL: postgres://lucida:lucida@localhost:5432/lucida_test
          # Turn a skip into a failure: a container that never came up, or
          # a typo in the URL above, would otherwise report green.
          LUCIDA_TEST_POSTGRES_REQUIRED: '1'
        run: cargo test --locked --workspace --all-features

      # Format check: enforces `cargo fmt --all` consistency across the
      # workspace. The format sweep landed alongside the lint debt cleanup
      # in #498 (slice A+B); this gate prevents drift from creeping back.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Hard gate as of #498 (slices A–C). All pre-existing clippy errors
      # have been resolved; new ones must be fixed before merge.
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  web:
    name: Web (wasm-pack + pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build (shared with rust job)
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin an explicit version. `version: latest` resolves via a GitHub
          # API call from the runner; under rate limits the action silently
          # falls back to wasm-pack v0.9.1 (2020), whose generated
          # pkg/package.json vitest cannot resolve — the wasm-importing test
          # files then fail with "Failed to resolve entry for lucida-core"
          # while build/install/tsc/lint pass (lucida-cuk). Keep this in lockstep
          # with the wasm-pack pin in Dockerfile.
          version: 'v0.15.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: lucida-web/pnpm-lock.yaml

      # Args after `--` are forwarded to the underlying `cargo build`.
      # Best-effort only: wasm-pack's own pre-build `cargo metadata`
      # runs unlocked and would silently repair a desynced Cargo.lock
      # before the forwarded --locked could reject it. The hard lock
      # gate is the rust job's `cargo test --locked`.
      - name: Build lucida-core WASM (consumed by lucida-web)
        working-directory: lucida-core
        run: wasm-pack build --target web --out-dir pkg -- --locked

      - name: Install web deps
        working-directory: lucida-web
        run: pnpm install --frozen-lockfile

      - name: Type check (the -p tsconfig.app.json flag is load-bearing)
        working-directory: lucida-web
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

      # Hard gate as of #498 (slices A–C). All pre-existing lint errors have
      # been resolved (with documented per-site eslint-disable directives for
      # load-bearing patterns the strict eslint-plugin-react-hooks@7 flags).
      - name: Lint
        working-directory: lucida-web
        run: pnpm run lint

      - name: Test
        working-directory: lucida-web
        run: pnpm test

      - name: Build SPA
        working-directory: lucida-web
        run: pnpm run build

  docker:
    name: Docker smoke build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # paths-filter needs read access to PR refs to diff against base.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      # Skip the build entirely on PRs that don't touch the Docker
      # build context. The rust + web jobs already prove the code
      # compiles; this job's unique value is "Dockerfile + .dockerignore
      # + crate copy list still works." Wiki/doc/k8s-only PRs get a
      # near-instant pass through. Push events (merges to main) and
      # release-please PRs always build (see gate step below).
      - name: Detect build-context changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            build:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'lucida-cli/src/**'
              - 'lucida-content/src/**'
              - 'lucida-core/src/**'
              - 'lucida-protocol/src/**'
              - 'lucida-proxy/src/**'
              - 'lucida-server/src/**'
              - 'lucida-store/src/**'
              - 'lucida-web/src/**'
              - 'lucida-web/public/**'
              - 'lucida-web/index.html'
              - 'lucida-web/package.json'
              - 'lucida-web/pnpm-lock.yaml'
              - 'lucida-web/tsconfig*.json'
              - 'lucida-web/vite.config.ts'

      # Single condition reused by every subsequent step: build on push
      # events, on release-please PRs (which also get the true smoke
      # below), and on PRs whose changes touch the build context.
      - name: Decide whether to build
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] \
             || [[ "${{ github.head_ref }}" == "release-please--branches--main" ]] \
             || [[ "${{ steps.filter.outputs.build }}" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No build-context changes; skipping docker build."
          fi

      - name: Set up Docker Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      # Single-arch (amd64) for speed. Multi-arch is the release
      # workflow's job; for PR signal all we need is "the Dockerfile
      # still builds end-to-end". `load: true` makes the
      # image available for the run-and-probe step on release-please
      # PRs (and for any later local inspection).
      #
      # GHA buildx cache (mode=max) exports every intermediate stage so
      # subsequent CI runs reuse the cargo + pnpm build layers when the
      # COPY inputs haven't changed. First-build-on-branch is still
      # cold; pushed fixup commits and rebases see warm caches.
      - name: Build image (single-arch, no push)
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: lucida:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # True smoke (release-please PRs only): start the image and prove
      # the binary actually serves /healthz, /readyz, /version. This is
      # the last gate before merging the release PR fires release.yml;
      # on every other PR the cargo + pnpm build artifacts inside the
      # image are already exercised by the rust + web jobs, so the
      # build alone is sufficient Dockerfile signal.
      #
      # LUCIDA_AUTH=disabled bypasses ADR-0018 bind-address auto-detect
      # (which would otherwise demand OAuth on the wildcard bind the
      # Dockerfile sets) — the smoke is verifying process startup +
      # health endpoints, not the auth path. LUCIDA_INSECURE=1 is the
      # documented opt-in that prevents accidentally shipping `disabled`
      # on a non-loopback bind without acknowledging it; the ephemeral
      # CI runner is the textbook legitimate-insecure case.
      - name: True smoke (run + probe)
        if: github.head_ref == 'release-please--branches--main'
        run: |
          set -euo pipefail
          docker run -d --name lucida-smoke -p 9876:9876 \
            -e LUCIDA_AUTH=disabled \
            -e LUCIDA_INSECURE=1 \
            lucida:ci-smoke
          # Poll until /healthz answers or 30s elapses. The binary
          # starts in well under a second; the deadline tolerates
          # runner cold-start jitter without masking real hangs.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9876/healthz > /dev/null; then
              echo "healthz up after ${i}s"
              break
            fi
            sleep 1
            if [[ "$i" == "30" ]]; then
              echo "::error::healthz never responded within 30s"
              exit 1
            fi
          done
          echo "--- /healthz ---"; curl -fsS http://localhost:9876/healthz; echo
          echo "--- /readyz ---";  curl -fsS http://localhost:9876/readyz;  echo
          echo "--- /version ---"; curl -fsS http://localhost:9876/version; echo

      - name: Container logs on smoke failure
        if: failure() && github.head_ref == 'release-please--branches--main'
        run: docker logs lucida-smoke || true

  manifests:
    name: K8s manifest dry-run (extras/deploy/k8s)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The reference manifests in extras/deploy/k8s/ ship with
      # <UPPERCASE-WITH-DASHES> placeholders per ADR-0021. Substitute
      # them to dummy strings in a scratch directory, then run
      # `kubectl apply --dry-run=client` to validate schema + structure.
      # No real cluster involved; this catches typos and apiVersion
      # regressions without needing a kind/minikube spin-up.
      - name: Substitute placeholders to dummy values
        run: |
          set -euo pipefail
          mkdir -p /tmp/k8s-rendered
          cp extras/deploy/k8s/*.yaml /tmp/k8s-rendered/
          # Keep this list aligned with the placeholders documented in
          # extras/deploy/RUNBOOK.md step 4. Add a substitution here when
          # you introduce a new <PLACEHOLDER> in the manifests.
          sed -i \
            -e 's|<YOUR-NAMESPACE>|lucida-ci|g' \
            -e 's|<YOUR-REGISTRY>/lucida:<YOUR-TAG>|ghcr.io/example/lucida:dummy|g' \
            -e 's|<YOUR-OAUTH-CLIENT-ID>|dummy-client-id|g' \
            -e 's|<YOUR-EXTERNAL-HOSTNAME>|lucida.example.test|g' \
            -e 's|<YOUR-STORAGE-CLASS>|standard|g' \
            -e 's|<YOUR-INGRESS-CLASS>|nginx|g' \
            -e 's|<YOUR-TLS-SECRET>|lucida-tls|g' \
            /tmp/k8s-rendered/*.yaml
          # Fail loud if any <PLACEHOLDER> survived the substitution on
          # an *active* (non-comment) YAML line — otherwise kubectl might
          # happily accept the literal string and we'd lose the signal
          # that a new placeholder was added without updating this job.
          # Comments may legitimately reference placeholders (e.g.,
          # documentation of optional env vars); we ignore them here.
          if grep -RnE '<[A-Z][A-Z0-9-]+>' /tmp/k8s-rendered/ | grep -vE ':[[:space:]]*#'; then
            echo "::error::Unsubstituted placeholder on a non-comment line — add the matching sed line above."
            exit 1
          fi

      # kubeconform validates k8s manifests against bundled OpenAPI
      # schemas — fully offline, no apiserver round-trip required.
      # `kubectl apply --dry-run=client` doesn't work for offline CI
      # because even with --validate=false it tries to look up resource
      # types via REST mapping (hits localhost:8080).
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: kubeconform validation
        run: kubeconform -strict -summary /tmp/k8s-rendered/

  python:
    name: lucida-py (maturin + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build (shared with rust job)
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # lucida-py is excluded from the cargo workspace, so the `rust` job does
      # NOT build it — this job is its sole CI gate. Build the pyo3 extension
      # with maturin and run the client tests. uv provisions a >=3.10
      # interpreter per pyproject's requires-python.
      - name: Build extension + run tests
        working-directory: lucida-py
        run: |
          uv sync --python 3.12
          uv run maturin develop
          uv run pytest -q
