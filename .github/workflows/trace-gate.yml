name: Trace gate

# Opens generated datasets in headless Chrome on SwiftShader's WebGPU and runs
# `lucida trace --gate` on each: a view that never settles, stalls, or leaves
# a failing verdict fails the job. No GPU is needed, so a hosted runner can
# catch what the unit tests cannot see.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [ci/trace-gate]

concurrency:
  group: trace-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lucida trace --gate (SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Both builds read the cache the CI workflow's Docker job writes, so on
      # an unchanged build context they rebuild nothing. The CLI's own stage
      # keeps a separate scope: writing the shared one would replace the
      # Docker job's entries with the CLI's.
      - name: Build the lucida CLI
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/cli
          cache-from: |
            type=gha
            type=gha,scope=trace-gate-cli
          cache-to: type=gha,mode=max,scope=trace-gate-cli

      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lucida:ci-smoke
          cache-from: type=gha

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The server opens each dataset by the path the CLI names, so the data
      # directory is mounted at the same path inside the container. Auth is
      # off for the reason the CI smoke gives: an ephemeral runner.
      - name: Start the server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-data"
          docker run -d --name lucida-gate -p 9876:9876 \
            -e LUCIDA_AUTH=disabled \
            -e LUCIDA_INSECURE=1 \
            -v "$RUNNER_TEMP/gate-data:$RUNNER_TEMP/gate-data:ro" \
            lucida:ci-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9876/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::healthz never responded within 30s"
          exit 1

      # The CLI launches Chrome with flags that reach a real GPU through
      # Vulkan. The runner has none, so WebGPU and ANGLE are pointed at the
      # SwiftShader Vulkan device Chrome ships with. Flags after the CLI's
      # win, and the sandbox is off because the runner's AppArmor policy
      # refuses the user namespaces it needs.
      - name: Point Chrome at SwiftShader
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/chrome-swiftshader" <<'EOF'
          #!/bin/sh
          exec google-chrome "$@" \
            --use-vulkan=swiftshader \
            --use-webgpu-adapter=swiftshader \
            --enable-unsafe-swiftshader \
            --no-sandbox
          EOF
          chmod +x "$RUNNER_TEMP/chrome-swiftshader"
          google-chrome --version

      - name: Run the gate
        env:
          LUCIDA_GATE_CLI: ${{ runner.temp }}/cli/lucida
          LUCIDA_GATE_DATA: ${{ runner.temp }}/gate-data
          LUCIDA_GATE_OUTPUT: ${{ runner.temp }}/gate-out
          LUCIDA_BROWSER: ${{ runner.temp }}/chrome-swiftshader
        run: scripts/trace_gate.sh

      - name: Server logs
        if: failure()
        run: docker logs lucida-gate || true

      # The bundles carry each run's trace, settled frame, view URL and
      # header, which is what `lucida trace show` and `trace replay` read.
      - name: Upload runs and bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-gate-runs
          path: ${{ runner.temp }}/gate-out
          if-no-files-found: ignore
          retention-days: 14
