name: Trace gate

# Opens generated datasets in headless Chrome on SwiftShader's WebGPU and runs
# `lucida trace --gate` on each: a view that never settles, stalls, or leaves
# a failing verdict fails the job. No GPU is needed, so a hosted runner can
# catch what the unit tests cannot see.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [ci/trace-gate]

concurrency:
  group: trace-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lucida trace --gate (SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Both builds read the cache the CI workflow's Docker job writes, so on
      # a build context main has already built they rebuild nothing. Each
      # also keeps a scope of its own, for runs whose context main has not
      # built: writing the shared scope would replace the Docker job's
      # entries, and one scope for both targets would keep only the last.
      - name: Build the lucida CLI
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/cli
          cache-from: |
            type=gha
            type=gha,scope=trace-gate-cli
            type=gha,scope=trace-gate-server
          cache-to: type=gha,mode=max,scope=trace-gate-cli

      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lucida:ci-smoke
          cache-from: |
            type=gha
            type=gha,scope=trace-gate-server
            type=gha,scope=trace-gate-cli
          cache-to: type=gha,mode=max,scope=trace-gate-server

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The server opens each dataset by the path the CLI names, so the data
      # directory is mounted at the same path inside the container. Auth is
      # off for the reason the CI smoke gives: an ephemeral runner.
      - name: Start the server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-data"
          docker run -d --name lucida-gate -p 9876:9876 \
            -e LUCIDA_AUTH=disabled \
            -e LUCIDA_INSECURE=1 \
            -v "$RUNNER_TEMP/gate-data:$RUNNER_TEMP/gate-data:ro" \
            lucida:ci-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9876/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::healthz never responded within 30s"
          exit 1

      # With the CLI's Vulkan flags and no Vulkan device, Chrome's GPU
      # process falls back again and again, and each fallback destroys the
      # page's WebGPU device. Mesa's lavapipe gives it a CPU Vulkan device to
      # start on; WebGPU itself still runs on SwiftShader.
      - name: Install a software Vulkan driver
        run: sudo apt-get install -y -q mesa-vulkan-drivers

      - name: Probe (temporary)
        run: |
          set +e -uo pipefail
          out="$RUNNER_TEMP/gate-out"; mkdir -p "$out"
          data="$RUNNER_TEMP/gate-data"
          uv run extras/synthetic_ome_zarr.py "$data/image.ome.zarr" --overwrite --size 2048,2048 --channels 2 --levels 4 --chunk 256
          uv run extras/synthetic_ome_zarr.py "$data/volume.ome.zarr" --overwrite --size 128,512,512 --channels 3 --levels 3 --chunk 64
          export LUCIDA_CONFIG_PATH="$out/probe-config.json" LUCIDA_TRACE_DIR="$out"
          cli="$RUNNER_TEMP/cli/lucida"
          printf '#!/bin/sh\nexec google-chrome "$@" --no-sandbox\n' > "$RUNNER_TEMP/chrome-no-sandbox"
          chmod +x "$RUNNER_TEMP/chrome-no-sandbox"
          probe() {
            local name=$1 browser=$2; shift 2
            "$cli" --server http://127.0.0.1:9876 workspace create "probe-$name" > /dev/null
            local started=$SECONDS
            if [[ -n "$browser" ]]; then export LUCIDA_BROWSER="$browser"; else unset LUCIDA_BROWSER; fi
            timeout 300 "$cli" --server http://127.0.0.1:9876 --workspace "probe-$name" trace "$@" --gate \
              --output "$out/probe-$name.json" > "$out/probe-$name.txt" 2>&1
            local status=$?
            echo "=== $name exit $status in $((SECONDS - started)) s"
            grep -E "VERDICT|^client|^run  |^error" "$out/probe-$name.txt"
            return $status
          }
          browser=""
          if ! probe plain "" "$data/image.ome.zarr" --camera slice --timeout-seconds 60; then
            browser="$RUNNER_TEMP/chrome-no-sandbox"
            probe no-sandbox "$browser" "$data/image.ome.zarr" --camera slice --timeout-seconds 60
          fi
          probe arcball-small-dpr1 "$browser" "$data/volume.ome.zarr" --camera arcball --width 720 --height 450 --device-pixel-ratio 1 --timeout-seconds 240
          probe arcball-small-dpr2 "$browser" "$data/volume.ome.zarr" --camera arcball --width 720 --height 450 --device-pixel-ratio 2 --timeout-seconds 240
          if [[ -n "$browser" ]]; then echo "LUCIDA_BROWSER=$browser" >> "$GITHUB_ENV"; fi
          exit 0

      - name: Run the gate
        env:
          LUCIDA_GATE_CLI: ${{ runner.temp }}/cli/lucida
          LUCIDA_GATE_DATA: ${{ runner.temp }}/gate-data
          LUCIDA_GATE_OUTPUT: ${{ runner.temp }}/gate-out
        run: scripts/trace_gate.sh

      - name: Server logs
        if: failure()
        run: docker logs lucida-gate || true

      # The bundles carry each run's trace, settled frame, view URL and
      # header, which is what `lucida trace show` and `trace replay` read.
      - name: Upload runs and bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-gate-runs
          path: ${{ runner.temp }}/gate-out
          if-no-files-found: ignore
          retention-days: 14
