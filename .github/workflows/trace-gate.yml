name: Trace gate

# Opens generated datasets in headless Chrome on SwiftShader's WebGPU and runs
# `lucida trace --gate` on each: a view that never settles, stalls, or leaves
# a failing verdict fails the job. No GPU is needed, so a hosted runner can
# catch what the unit tests cannot see.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [ci/trace-gate]

concurrency:
  group: trace-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lucida trace --gate (SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Both builds read the cache the CI workflow's Docker job writes, so on
      # a build context main has already built they rebuild nothing. Each
      # also keeps a scope of its own, for runs whose context main has not
      # built: writing the shared scope would replace the Docker job's
      # entries, and one scope for both targets would keep only the last.
      - name: Build the lucida CLI
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/cli
          cache-from: |
            type=gha
            type=gha,scope=trace-gate-cli
            type=gha,scope=trace-gate-server
          cache-to: type=gha,mode=max,scope=trace-gate-cli

      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lucida:ci-smoke
          cache-from: |
            type=gha
            type=gha,scope=trace-gate-server
            type=gha,scope=trace-gate-cli
          cache-to: type=gha,mode=max,scope=trace-gate-server

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The server opens each dataset by the path the CLI names, so the data
      # directory is mounted at the same path inside the container. Auth is
      # off for the reason the CI smoke gives: an ephemeral runner.
      - name: Start the server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-data"
          docker run -d --name lucida-gate -p 9876:9876 \
            -e LUCIDA_AUTH=disabled \
            -e LUCIDA_INSECURE=1 \
            -v "$RUNNER_TEMP/gate-data:$RUNNER_TEMP/gate-data:ro" \
            lucida:ci-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9876/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::healthz never responded within 30s"
          exit 1

      - name: Probe Chrome flags (temporary)
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/gate-out"; mkdir -p "$out"
          uv run extras/synthetic_ome_zarr.py "$RUNNER_TEMP/gate-data/image.ome.zarr" --size 2048,2048 --channels 2 --levels 4 --chunk 256
          export LUCIDA_CONFIG_PATH="$out/probe-config.json" LUCIDA_TRACE_DIR="$out"
          cli="$RUNNER_TEMP/cli/lucida"
          strip='s/ --enable-features=Vulkan / /; s/ --use-angle=vulkan / /; s/ --disable-vulkan-surface / /'
          declare -A variants=(
            [a-current]='keep|--use-vulkan=swiftshader --use-webgpu-adapter=swiftshader --enable-unsafe-swiftshader --no-sandbox'
            [b-angle-sw]='keep|--use-angle=swiftshader --use-webgpu-adapter=swiftshader --enable-unsafe-swiftshader --no-sandbox'
            [c-no-vulkan-sw]='keep|--use-webgpu-adapter=swiftshader --enable-unsafe-swiftshader --no-sandbox'
            [d-strip-angle-sw]='strip|--enable-features=Vulkan --use-angle=swiftshader --use-webgpu-adapter=swiftshader --enable-unsafe-swiftshader --no-sandbox'
            [e-strip-novulkan]='strip|--use-angle=swiftshader --use-webgpu-adapter=swiftshader --enable-unsafe-swiftshader --no-sandbox'
            [f-current-nowatchdog]='keep|--use-vulkan=swiftshader --use-webgpu-adapter=swiftshader --enable-unsafe-swiftshader --no-sandbox --disable-gpu-watchdog'
          )
          picked=""
          for v in a-current b-angle-sw c-no-vulkan-sw d-strip-angle-sw e-strip-novulkan f-current-nowatchdog; do
            mode="${variants[$v]%%|*}"; extra="${variants[$v]#*|}"
            w="$RUNNER_TEMP/chrome-$v"
            {
              echo '#!/bin/bash'
              if [[ "$mode" == strip ]]; then
                echo 'args=" $* "'
                echo "args=\"\$(sed -e '$strip' <<< \"\$args\")\""
                echo "exec google-chrome \$args $extra --enable-logging --log-file=$out/chrome-$v.log"
              else
                echo "exec google-chrome \"\$@\" $extra --enable-logging --log-file=$out/chrome-$v.log"
              fi
            } > "$w"
            chmod +x "$w"
            cat "$w"
            "$cli" --server http://127.0.0.1:9876 workspace create "probe-$v" > /dev/null
            LUCIDA_BROWSER="$w" timeout 150 "$cli" --server http://127.0.0.1:9876 --workspace "probe-$v" \
              trace "$RUNNER_TEMP/gate-data/image.ome.zarr" --camera slice --timeout-seconds 60 --gate \
              --output "$out/probe-$v.json" > "$out/probe-$v.txt" 2>&1
            status=$?
            echo "=== $v exit $status"
            grep -E "VERDICT|^client|^run  |^error" "$out/probe-$v.txt"
            grep -iE "lost|crash|vulkan|dawn|webgpu|swiftshader|gpu_process|context" "$out/chrome-$v.log" | grep -v "Fontconfig" | head -25
            if [[ "$status" -eq 0 && -z "$picked" ]]; then picked="$w"; fi
          done
          echo "picked: ${picked:-none}"
          echo "LUCIDA_BROWSER=${picked:-$RUNNER_TEMP/chrome-a-current}" >> "$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP/gate-data/image.ome.zarr"

      - name: Run the gate
        env:
          LUCIDA_GATE_CLI: ${{ runner.temp }}/cli/lucida
          LUCIDA_GATE_DATA: ${{ runner.temp }}/gate-data
          LUCIDA_GATE_OUTPUT: ${{ runner.temp }}/gate-out
          LUCIDA_GATE_TIMEOUT: '90'
        run: scripts/trace_gate.sh

      - name: Server logs
        if: failure()
        run: docker logs lucida-gate || true

      # The bundles carry each run's trace, settled frame, view URL and
      # header, which is what `lucida trace show` and `trace replay` read.
      - name: Upload runs and bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-gate-runs
          path: ${{ runner.temp }}/gate-out
          if-no-files-found: ignore
          retention-days: 14
