name: Trace gate

# Opens generated datasets in headless Chrome on SwiftShader's WebGPU and runs
# `lucida trace --gate` on each, through the perf runner's `gate` suite: a
# view that never settles, stalls, or leaves a failing verdict fails the job.
# No GPU is needed, so a hosted runner can catch what the unit tests cannot
# see.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: trace-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that touches nothing the gate builds or drives skips it.
  # The filter is a job rather than trigger paths so that the `Trace gate`
  # job below always reports, which a required check needs.
  changes:
    name: Decide whether to run the gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gate: ${{ github.event_name != 'pull_request' || steps.filter.outputs.gate == 'true' }}
    steps:
      - name: Detect changes the gate can see
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            gate:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'lucida-cli/src/**'
              - 'lucida-content/src/**'
              - 'lucida-core/src/**'
              - 'lucida-protocol/src/**'
              - 'lucida-server/src/**'
              - 'lucida-store/src/**'
              - 'lucida-web/src/**'
              - 'lucida-web/public/**'
              - 'lucida-web/index.html'
              - 'lucida-web/package.json'
              - 'lucida-web/pnpm-lock.yaml'
              - 'lucida-web/pnpm-workspace.yaml'
              - 'lucida-web/tsconfig*.json'
              - 'lucida-web/vite.config.ts'
              - 'extras/synthetic_ome_zarr.py'
              - 'scripts/perf.py'
              - 'scripts/perf/**'
              - 'scripts/trace_gate.sh'
              - '.github/workflows/trace-gate.yml'

  # Two halves of the runs on two runners, so the wall clock is one half's.
  # The runs are split by dataset and by their measured seconds, not by
  # count: the volume's two runs take about as long as the other three
  # datasets' together.
  gate:
    name: lucida trace --gate (SwiftShader, ${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: volume, sliced and ray-marched
            datasets: volume
            saves-cache: true
          - part: image, collection and generated coarse
            datasets: image collection single-level
            saves-cache: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Both builds read the cache the CI workflow's Docker job writes on
      # main, so a stage it has built is not built again. Each also keeps its
      # own final layers, which is all an unchanged build needs. Exporting
      # every stage instead would copy the Docker job's largest layers into
      # the repository's cache a second time, and writing its scope would
      # replace that job's entries.
      #
      # A pull request reads these caches and writes none: an entry saved
      # from a pull request serves only that pull request, and every one
      # counts against the repository's 10 GB, past which the entries main's
      # runs depend on are evicted. One half saves, since both build the
      # same thing.
      - name: Build the lucida CLI
        uses: docker/build-push-action@v7
        with:
          context: .
          target: cli
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/cli
          cache-from: |
            type=gha
            type=gha,scope=trace-gate-cli
          cache-to: ${{ github.event_name != 'pull_request' && matrix.saves-cache && 'type=gha,mode=min,scope=trace-gate-cli' || '' }}

      - name: Build the server image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lucida:ci-smoke
          cache-from: |
            type=gha
            type=gha,scope=trace-gate-server
          cache-to: ${{ github.event_name != 'pull_request' && matrix.saves-cache && 'type=gha,mode=min,scope=trace-gate-server' || '' }}

      # From PyPI, as in the CI workflow's lucida-py job, at the same version.
      - name: Install uv
        env:
          UV_VERSION: 0.13.7
        run: pipx install "uv==$UV_VERSION"

      # The server opens each dataset by the path the CLI names, so the data
      # directory is mounted at the same path inside the container. Auth is
      # off for the reason the CI smoke gives: an ephemeral runner.
      - name: Start the server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-data"
          docker run -d --name lucida-gate -p 9876:9876 \
            -e LUCIDA_AUTH=disabled \
            -e LUCIDA_INSECURE=1 \
            -v "$RUNNER_TEMP/gate-data:$RUNNER_TEMP/gate-data:ro" \
            lucida:ci-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9876/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::healthz never responded within 30s"
          exit 1

      # Without a Vulkan driver on the runner, Chrome destroys the page's
      # WebGPU device within seconds of creating it, whatever GPU flags it is
      # given. Mesa's lavapipe supplies one. The page's adapter is still
      # SwiftShader, which the run's client line reports.
      #
      # Its packages are cached, keyed by the runner image they were resolved
      # against, so that a run need not reach the Ubuntu archive. Bump the
      # number in the key to discard every entry. Unlike the builds, a pull
      # request saves this cache: the entry is a few megabytes, and a pull
      # request misses main's only on an image main's nightly run has not used.
      - name: Key the Vulkan driver's packages
        id: vulkan-key
        run: |
          prefix="mesa-vulkan-drivers-1-$ImageOS-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$ImageVersion" >> "$GITHUB_OUTPUT"

      # An older image's packages usually still install, so they carry the
      # gate through an archive outage that follows an image update.
      - name: Restore the Vulkan driver's packages
        id: vulkan-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vulkan-debs
          key: ${{ steps.vulkan-key.outputs.key }}
          restore-keys: ${{ steps.vulkan-key.outputs.prefix }}

      # Cached packages install as a set that may neither download nor remove
      # anything. A set that does not fit this image fails before dpkg
      # changes anything, and the packages are downloaded afresh.
      - name: Install a software Vulkan driver
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir="$RUNNER_TEMP/vulkan-debs"

          # apt skips downloading a named .deb only when the same file is in
          # its own archive directory.
          install_cached() {
            local debs=("$dir"/*.deb)
            (( ${#debs[@]} )) \
              && sudo cp "${debs[@]}" /var/cache/apt/archives/ \
              && sudo apt-get install -y -q --no-download --no-remove "${debs[@]}"
          }

          if install_cached; then
            echo "Installed the cached packages without contacting the archive"
            exit 0
          fi
          if [[ -d "$dir" ]]; then
            echo "::warning::The cached packages do not install on this runner image; downloading them"
          fi

          rm -rf "$dir"
          sudo apt-get clean
          # Refreshed once, not per attempt: with the archive unreachable a
          # refresh takes minutes and only warns, and the download then
          # resolves against the image's own indexes.
          sudo apt-get update -q || true
          attempt=1
          until sudo apt-get install -y -q --download-only mesa-vulkan-drivers; do
            if (( attempt == 4 )); then
              echo "::error::Could not download the packages from the Ubuntu archive"
              exit 1
            fi
            delay=$(( 15 * 2 ** (attempt - 1) ))
            echo "::warning::Download attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
            attempt=$(( attempt + 1 ))
          done
          mkdir -p "$dir"
          cp /var/cache/apt/archives/*.deb "$dir"/
          install_cached

      # Saved here rather than at the end of the job, so that a failing gate
      # still keeps them. One half saves, as for the builds.
      - name: Save the Vulkan driver's packages
        if: steps.vulkan-cache.outputs.cache-hit != 'true' && matrix.saves-cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vulkan-debs
          key: ${{ steps.vulkan-key.outputs.key }}

      # The runner's first Chrome launch pays for cold disk and font caches,
      # and once that pushed the first run's plan pass past its ceiling. An
      # ungated run pays it instead.
      - name: Warm up Chrome
        run: |
          data="$RUNNER_TEMP/gate-data"
          uv run extras/synthetic_ome_zarr.py "$data/warm-up.ome.zarr" --size 256,256 --levels 2 --chunk 128
          lucida="$RUNNER_TEMP/cli/lucida --server http://127.0.0.1:9876"
          $lucida workspace create warm-up > /dev/null
          $lucida --workspace warm-up trace "$data/warm-up.ome.zarr" --output "$RUNNER_TEMP/warm-up.json" > /dev/null || true

      # The runner builds nothing and starts no server here: it drives the
      # container with the CLI built above.
      - name: Run the gate
        env:
          LUCIDA_GATE_SERVER: http://127.0.0.1:9876
          LUCIDA_GATE_CLI: ${{ runner.temp }}/cli/lucida
          LUCIDA_GATE_DATA: ${{ runner.temp }}/gate-data
          LUCIDA_GATE_OUTPUT: ${{ runner.temp }}/gate-out
          LUCIDA_GATE_ONLY: ${{ matrix.datasets }}
        run: scripts/trace_gate.sh

      - name: Server logs
        if: failure()
        run: docker logs lucida-gate || true

      # The bundles carry each run's trace, settled frame, view URL and
      # header, which is what `lucida trace show` and `trace replay` read.
      - name: Upload runs and bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trace-gate-runs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/gate-out
          if-no-files-found: ignore
          retention-days: 14

      # A passing run's phases are what the diagnostic's ceilings are checked
      # against on this rasterizer, so its run files are kept too, without
      # the bundles.
      - name: Upload runs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: trace-gate-runs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/gate-out
            !${{ runner.temp }}/gate-out/**/*.bundle.json
          if-no-files-found: ignore
          retention-days: 14

  # One check whatever the matrix holds, and a pass when the filter skipped
  # the gate.
  result:
    name: Trace gate
    needs: [changes, gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every part passed or the gate was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          GATE: ${{ needs.gate.result }}
        run: |
          echo "changes: $CHANGES, gate: $GATE"
          [[ "$CHANGES" == "success" ]] && [[ "$GATE" == "success" || "$GATE" == "skipped" ]]
