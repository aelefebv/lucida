name: Release image

# Fires on git-tag push matching v*. The tag is created by merging the
# release-please PR (see .github/workflows/release-please.yml). End-to-
# end: Conventional Commit on main -> release-please opens release PR ->
# maintainer merges -> tag is pushed -> this workflow builds the multi-
# arch image, generates SBOM + provenance, scans with Trivy, and pushes
# to ghcr.io/aelefebv/lucida:<tag> (and :latest).
#
# Architecture: per-arch jobs build on NATIVE runners (no QEMU), push
# the built image by digest, then a merge job assembles the multi-arch
# manifest list pointing at both digests. This is the docker/build-push-
# action canonical pattern for multi-arch + native runners. QEMU emul-
# ation of arm64 on amd64 hosts is 5-10x slower for Rust compilation
# (the dominant cost in lucida's Dockerfile); v0.2.0 timed out at the
# 60-min cap. Native arm64 runners (free for public repos) bring the
# total build to ~15 min.
on:
  push:
    tags: ['v*']

# packages:write is required to push to ghcr.io.
# id-token:write is required for SBOM provenance attestation through buildx.
# contents:read is the default-floor scope for actions/checkout.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-arch metadata; only labels are used at this stage. The full
      # tag list (vX.Y.Z + latest) lands on the multi-arch manifest in
      # the merge job below.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # Push by digest only — no human-readable tags yet. The merge job
      # collects both digests and creates the multi-arch manifest list
      # carrying the actual tags. push-by-digest=true means each per-arch
      # build publishes a manifest reachable only by sha256:... — the
      # merge step is what makes them addressable as :vX.Y.Z + :latest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # provenance requires id-token:write + omitting tags (handled by merge job)
          provenance: true
          sbom: true

      # The merge job needs to know which digest each per-arch build
      # produced. Write the digest to a tiny file in a known location
      # then upload as an artifact for the merge job to download.
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge per-arch manifests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag list resolved here, applied to the multi-arch manifest list
      # produced below. type=ref,event=tag uses the pushed tag name
      # (e.g. v0.2.0); type=raw,value=latest moves :latest to this tag.
      - name: Extract manifest metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # Assemble the manifest list from the per-arch digests and push
      # under all the resolved tags. `docker buildx imagetools create`
      # is registry-side: no image pull/push of the actual layers, just
      # a manifest write. Sub-second.
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  scan:
    name: Trivy scan (block on CRITICAL)
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Initially permissive: only fail on CRITICAL severity, ignore
      # unfixed CVEs. Adopters / maintainers can tighten over time
      # (HIGH, MEDIUM) once the upstream image's CVE baseline is known.
      # ignore-unfixed avoids blocking on CVEs whose only "fix" is
      # waiting for an upstream package update we don't control.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
