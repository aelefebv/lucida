name: Release image

# Fires on git-tag push matching v*. The tag is created by merging the
# release-please PR (see .github/workflows/release-please.yml). End-to-
# end: Conventional Commit on main -> release-please opens release PR ->
# maintainer merges -> tag is pushed -> this workflow builds the multi-
# arch image, generates SBOM + provenance, scans with Trivy, and pushes
# to ghcr.io/aelefebv/lucida:<tag> (and :latest).
on:
  push:
    tags: ['v*']

# packages:write is required to push to ghcr.io.
# id-token:write is required for SBOM provenance attestation through buildx.
# contents:read is the default-floor scope for actions/checkout.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    name: Build, scan, and push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the linux/amd64 runner emulate linux/arm64 so buildx
      # can produce both architectures from a single host.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes the tag list. type=ref,event=tag uses the pushed tag
      # name (e.g. v0.2.0); type=raw,value=latest moves the :latest
      # pointer to this tag. Adopters pinning :v0.2.0 are unaffected
      # by :latest moving — image-tag pinning is the promotion model
      # documented in wiki/gotchas/branching-and-releases.md.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # sbom:true and provenance:true emit an SPDX SBOM and a SLSA
      # provenance attestation alongside the image manifest. Adopters
      # can pull and verify with `cosign verify-attestation` or
      # `docker buildx imagetools inspect`.
      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true

      # Initially permissive: only fail on CRITICAL severity, ignore
      # unfixed CVEs. Adopters / maintainers can tighten over time
      # (HIGH, MEDIUM) once the upstream image's CVE baseline is known.
      # ignore-unfixed avoids blocking on CVEs whose only "fix" is
      # waiting for an upstream package update we don't control.
      - name: Trivy scan (block on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
