[project]
name = "lucida"
version = "0.1.0"
description = "Lightweight, high-performance, cross-platform ND microscopy viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "fsspec>=2025.7.0",
    "httpx>=0.28.1",
    "numpy>=2.3.2",
    "pydantic>=2.11.7",
    "pytest>=8.4.1",
    "typer>=0.16.1",
    "uvicorn>=0.35.0",
    "zarr>=3.1.2",
]

[project.scripts]
lucida = "lucida.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
