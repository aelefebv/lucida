[package]
name = "lucida-server"
version = "0.2.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "lucida-server"
path = "src/main.rs"

[dependencies]
lucida-content = { path = "../lucida-content" }
lucida-core = { path = "../lucida-core" }
lucida-protocol = { path = "../lucida-protocol" }
lucida-proxy = { path = "../lucida-proxy" }
lucida-store = { path = "../lucida-store" }
object_store = "0.12"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.11"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "json"] }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
num_cpus = "1"
rand = "0.8"
thiserror = "1"
bytemuck = "1"
async-trait = "0.1"
# Storage backends. Pin runtime-tokio-rustls to match tokio's runtime;
# macros for query helpers; chrono for the schema's timestamp columns.
#
# Both drivers compile unconditionally. `storage::open` can select only
# SQLite, so the PostgreSQL driver is carried for the conformance suite
# alone — but a suite behind a cargo feature is a suite most people never
# run, and the PostgreSQL cases are built to announce themselves as
# skipped on a machine with no database. See ADR-0058.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "macros", "chrono", "migrate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
# Cookie parsing/serialization. We use the bare `cookie` crate for
# surgical control over Set-Cookie attributes (HttpOnly, Secure
# auto-detect, SameSite=Lax, Max-Age tied to the hard cap).
cookie = "0.18"
# Google OAuth integration. `reqwest` with rustls-tls (matches sqlx)
# drives the token exchange and JWKS fetch. `jsonwebtoken` validates
# Google ID-token signatures and standard claims. `base64` +
# `urlencoding` are pulled in directly so the state-token + redirect-URL
# builders don't depend on `reqwest`'s private re-exports.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset"] }
# jsonwebtoken 10 dropped the `ring` backend (used elsewhere via rustls) and makes
# the crypto backend explicit. We pick `aws_lc_rs` over `rust_crypto`: the latter
# pulls the `rsa` crate (RUSTSEC-2023-0071 "Marvin", unpatched), which would add a
# new advisory. 10.3 fixes the exp/nbf type-confusion authz bypass; APIs unchanged.
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
base64 = "0.22"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Mock-Google harness: spins up an axum app on an ephemeral port that
# pretends to be Google's /token + /certs. `rsa` mints the fake signing
# key; the integration test signs a JWT with it and asserts the lucida
# server validates it via the cached JWKS.
rsa = { version = "0.9", features = ["sha2"] }
# `urlencoding` is also pulled in by the runtime crate but cargo's
# strict feature unification means listing it here lets the test
# import it without a workspace round-trip.
urlencoding = "2"
tokio-tungstenite = "0.29"
