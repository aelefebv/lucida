[package]
name = "lucida-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lucida-server"
path = "src/main.rs"

[dependencies]
lucida-core = { path = "../lucida-core" }
lucida-store = { path = "../lucida-store" }
object_store = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
