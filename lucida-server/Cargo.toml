[package]
name = "lucida-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "lucida-server"
path = "src/main.rs"

[dependencies]
lucida-content = { path = "../lucida-content" }
lucida-core = { path = "../lucida-core" }
lucida-protocol = { path = "../lucida-protocol" }
lucida-proxy = { path = "../lucida-proxy" }
lucida-store = { path = "../lucida-store" }
object_store = "0.12"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.13"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "json"] }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
num_cpus = "1"
rand = "0.10"
thiserror = "1"
bytemuck = "1"
async-trait = "0.1"
# Slice 2 (PRD #455): SQLite-backed session store. Pin runtime-tokio-rustls
# to match tokio's runtime; sqlite + macros for query helpers; chrono for
# the schema's timestamp columns.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "migrate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
# Cookie parsing/serialization. We use the bare `cookie` crate for
# surgical control over Set-Cookie attributes (HttpOnly, Secure
# auto-detect, SameSite=Lax, Max-Age tied to the hard cap).
cookie = "0.18"
# Slice 4 (PRD #455): Google OAuth integration. `reqwest` with
# rustls-tls (matches sqlx) drives the token exchange and JWKS fetch.
# `jsonwebtoken` validates Google ID-token signatures and standard
# claims. `base64` + `urlencoding` are pulled in directly so the
# state-token + redirect-URL builders don't depend on `reqwest`'s
# private re-exports.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset"] }
jsonwebtoken = "10"
base64 = "0.22"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Slice 4 mock-Google harness: spins up an axum app on an ephemeral
# port that pretends to be Google's /token + /certs. `rsa` mints the
# fake signing key; the integration test signs a JWT with it and
# asserts the lucida server validates it via the cached JWKS.
rsa = { version = "0.9", features = ["sha2"] }
# `urlencoding` is also pulled in by the runtime crate but cargo's
# strict feature unification means listing it here lets the test
# import it without a workspace round-trip.
urlencoding = "2"
