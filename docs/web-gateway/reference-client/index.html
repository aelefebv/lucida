<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lucida Step 11 Reference Client</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Lucida Web Gateway (Step 11)</h1>
      <section class="controls">
        <label>
          WS URL
          <input id="wsUrl" value="ws://127.0.0.1:8765/v1/ws" />
        </label>
        <label>
          Bearer Token
          <input id="token" type="password" placeholder="step11token" />
        </label>
        <label>
          Session ID
          <input id="sessionId" placeholder="uuidv7" />
        </label>
        <label>
          View ID
          <input id="viewId" placeholder="uuidv7" />
        </label>
        <div class="actions">
          <button id="connectBtn">Connect + Attach</button>
          <button id="sessionGetBtn" disabled>RPC: session.get</button>
        </div>
      </section>

      <section>
        <canvas id="renderCanvas" width="512" height="512"></canvas>
      </section>

      <section>
        <pre id="log"></pre>
      </section>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
