[package]
name = "lucida-content"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Carries the untrusted, opaque `image-label.properties` key/value bag on
# `LabelProperty.fields` (a `serde_json::Map`). This is manifest data that
# travels with `ImageSpec`, so `serde_json` is a normal dependency, not just a
# test one.
serde_json = "1"
# Used by `url::dataset_id_for_url` and `url::dataset_url_hash16` — the
# single source of truth for the BLAKE3-derived dataset id and proxy-cache
# directory name. Previously lived in `lucida-core` and `lucida-server`;
# unified here per `wiki/decisions/0042-canonical-dataset-url-form.md`.
blake3 = "1"
