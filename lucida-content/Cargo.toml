[package]
name = "lucida-content"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Used by `url::dataset_id_for_url` and `url::dataset_url_hash16` — the
# single source of truth for the BLAKE3-derived dataset id and proxy-cache
# directory name.
blake3 = "1"

[dev-dependencies]
serde_json = "1"
