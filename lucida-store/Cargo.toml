[package]
name = "lucida-store"
version = "0.1.0"
edition = "2024"

[dependencies]
tiff = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
memmap2 = "0.9"
lz4_flex = "0.11"
object_store = { version = "0.12", features = ["gcp"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
bytes = "1"
lru = "0.12"
lucida-core = { path = "../lucida-core" }

[profile.dev.package."*"]
opt-level = 2
