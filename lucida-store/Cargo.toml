[package]
name = "lucida-store"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
tiff = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
memmap2 = "0.9"
lz4_flex = "0.11"
crc32c = "0.6"
object_store = { version = "0.12", features = ["gcp", "aws", "http"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
bytes = "1"
lru = "0.16"
regex = "1"
tracing = "0.1"
lucida-content = { path = "../lucida-content" }
lucida-protocol = { path = "../lucida-protocol" }

[dev-dependencies]
async-trait = "0.1"

[profile.dev.package."*"]
opt-level = 2
