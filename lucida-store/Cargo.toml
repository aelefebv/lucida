[package]
name = "lucida-store"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
tiff = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
memmap2 = "0.9"
lz4_flex = "0.14"
crc32c = "0.6"
object_store = { version = "0.14", features = ["gcp", "aws", "http"] }
# The HTTP client of a restricted source policy, built to resolve names
# through the policy. The features match object_store's own client.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
ipnet = "2"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs"] }
futures-util = "0.3"
bytes = "1"
lru = "0.19"
regex = "1"
tracing = "0.1"
lucida-content = { path = "../lucida-content" }
lucida-protocol = { path = "../lucida-protocol" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
async-trait = "0.1"

[profile.dev.package."*"]
opt-level = 2
