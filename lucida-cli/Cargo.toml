[package]
name = "lucida-cli"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Lucida product command-line client; installs the `lucida` binary."

[[bin]]
name = "lucida"
path = "src/main.rs"

[dependencies]
lucida-core = { path = "../lucida-core" }
lucida-content = { path = "../lucida-content" }
lucida-protocol = { path = "../lucida-protocol" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
