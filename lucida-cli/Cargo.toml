[package]
name = "lucida-cli"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false
description = "Lucida product command-line client; installs the `lucida` binary."

[[bin]]
name = "lucida"
path = "src/main.rs"

[dependencies]
lucida-core = { path = "../lucida-core" }
lucida-content = { path = "../lucida-content" }
lucida-protocol = { path = "../lucida-protocol" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "charset", "query"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
font8x8 = "0.3"
rand = "0.10"
# Reads and writes the RFC 3339 times `dataset search --since` takes.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
lucida-core = { path = "../lucida-core", features = ["test-support"] }
