[package]
name = "lucida-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "lucida-cli"
path = "src/main.rs"

[dependencies]
lucida-core = { path = "../lucida-core" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
