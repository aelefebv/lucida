[package]
name = "lucida-cli"
version = "0.2.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "lucida"
path = "src/main.rs"

[dependencies]
lucida-core = { path = "../lucida-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
